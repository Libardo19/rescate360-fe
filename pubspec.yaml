name: rescate360
description: "RESCATE360 — App móvil de coordinación comunitaria en emergencias."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  dio: ^5.11.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.4.4
  connectivity_plus: ^7.3.1
  url_launcher: ^6.3.2
  intl: any
  uuid: ^4.6.0
  shared_preferences: ^2.3.0
  nearby_connections: ^4.3.0
  crypto: ^3.0.8
  permission_handler: ^13.0.2
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
